name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  minimum-toolchain:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: xcodebuild -version && xcrun swift --version
      - run: python3 Scripts/check_repository.py
      - name: Verification script regressions
        run: python3 -m unittest discover -s Scripts/tests -v
      - run: python3 Scripts/verify.py package-build
  integration:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SIMULATOR_OS: '26'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: xcodebuild -version && xcrun swift --version
      - run: python3 Scripts/check_repository.py
      - name: Release build
        run: python3 Scripts/verify.py package-build --configuration Release
      - name: Package tests
        run: python3 Scripts/verify.py package
      - name: README examples and clean Git URL integration
        run: python3 Scripts/check_integration.py
      - name: Release metadata
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 Scripts/check_repository.py --release
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: test-results
          path: TestResults/
          retention-days: 7
